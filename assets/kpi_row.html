<!-- One row of KPI cards, rendered in its own frame by views/common.py: kpi_row. __COLUMNS__, __CARD_HEIGHT__ and
     __CARDS__ are filled in from Python. Numbers count up (Magic UI "Number Ticker"). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* colours mirror views/theme.py */
  :root {
    --ink: #0b2545; --muted: #334155; --line: #e2e8f0;
    --good: #15803d; --good-bg: #e3f6ea;
    --bad: #b91c1c; --bad-bg: #fde8e8;
    --neutral: #0f766e; --neutral-bg: #e6f4f2;
  }
  html, body { margin: 0; background: transparent; }
  body { font-family: "Poppins", -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  .row { display: grid; grid-template-columns: repeat(__COLUMNS__, minmax(0, 1fr)); gap: 16px; padding: 2px 2px 8px; }
  .card {
    position: relative; box-sizing: border-box; height: __CARD_HEIGHT__px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 14px 18px; background: #fff; border: 1px solid var(--line); border-radius: 8px;
  }
  .good { --tone: var(--good); --tone-bg: var(--good-bg); }
  .bad { --tone: var(--bad); --tone-bg: var(--bad-bg); }
  .neutral { --tone: var(--neutral); --tone-bg: var(--neutral-bg); }
  .label { display: flex; align-items: flex-start; gap: 6px; font-size: 13px; line-height: 1.3; color: #64748b; }
  .info {
    flex: none; display: inline-grid; place-items: center; width: 14px; height: 14px; margin-top: 1px;
    border: 1px solid #9aa3ad; border-radius: 50%; font-size: 10px; color: #6b7684; cursor: help;
  }
  .value {
    font-size: 28px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.1;
    font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .delta {
    align-self: flex-start; font-size: 12.5px; font-weight: 500; color: var(--tone);
    /* always one line: a long note ends in "…" (full text on hover) instead of growing over the number */
    max-width: 100%; box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .delta:empty { visibility: hidden; }

</style>
<div class="row">__CARDS__</div>
<script>
  // Fit the cards to the frame's width: all in one row when each gets at least MIN_CARD px, otherwise two per row
  // (when they pair up evenly), otherwise one. Then grow the frame, and Streamlit's slot around it, to the rows used.
  const row = document.querySelector(".row"), MIN_CARD = 230, GAP = 16;
  const fit = () => {
    const n = row.children.length, w = row.clientWidth;
    const cols = [n, n % 2 === 0 ? n / 2 : 0, 1].find((c) => c && (w - GAP * (c - 1)) / c >= MIN_CARD) || 1;
    row.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
    const frame = window.frameElement, h = row.offsetHeight + "px";
    if (!frame) return;
    for (const el of [frame, frame.closest('[data-testid="stElementContainer"]')]) {
      if (el && el.style.height !== h) {
        el.style.setProperty("height", h, "important");
        el.style.setProperty("flex-basis", h, "important");
      }
    }
  };
  fit();
  window.addEventListener("resize", fit);  // the frame resizes with the page

  // Number Ticker: count each number up, easing out. On a rerun it counts from the value it last showed, so moving
  // an assumption slider animates the change instead of restarting from zero.
  const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const store = (() => { try { return window.sessionStorage; } catch (e) { return null; } })();
  const show = (el, v) => {
    const d = +el.dataset.decimals;
    el.textContent = el.dataset.prefix +
      v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }) + el.dataset.suffix;
  };
  document.querySelectorAll(".value[data-to]").forEach((el) => {
    const to = +el.dataset.to, key = "kpi:" + el.dataset.key;
    let from = 0;
    try { from = store && store.getItem(key) !== null ? +store.getItem(key) : 0; } catch (e) {}
    try { store && store.setItem(key, to); } catch (e) {}
    if (still || from === to) return show(el, to);
    show(el, from);  // start from the old value straight away, so the final number doesn't flash first
    const start = performance.now(), ms = 1100;
    const step = (now) => {
      const t = Math.min(1, (now - start) / ms), ease = 1 - Math.pow(1 - t, 3);
      show(el, from + (to - from) * ease);
      if (t < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
</script>
