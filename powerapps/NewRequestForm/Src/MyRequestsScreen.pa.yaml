                                  Children:
                                    - txtSAPCode:
                                        Control: Classic/TextInput@2.3.2
                                        Properties:
                                          BorderColor: =RGBA(200, 198, 196, 1)
                                          Color: =RGBA(50, 49, 48, 1)
                                          Default: =SelectedRequest.SAPCode
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          DisabledFill: =RGBA(242, 242, 241, 0)
                                          Fill: =RGBA(255, 255, 255, 1)
                                          FillPortions: =1
                                          Font: =Font.'Segoe UI'
                                          Height: =36
                                          HintText: ="SAP code"
                                          HoverBorderColor: =RGBA(16, 110, 190, 1)
                                          HoverColor: =RGBA(50, 49, 48, 1)
                                          HoverFill: =RGBA(255, 255, 255, 1)
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PressedBorderColor: =RGBA(0, 120, 212, 1)
                                          PressedColor: =RGBA(50, 49, 48, 1)
                                          PressedFill: =RGBA(255, 255, 255, 1)
                                          RadiusBottomLeft: =4
                                          RadiusBottomRight: =4
                                          RadiusTopLeft: =4
                                          RadiusTopRight: =4
                                          Size: =11
                                    - btnMarkCreated:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          Color: =RGBA(255, 255, 255, 1)
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          DisabledFill: =RGBA(237, 235, 233, 1)
                                          DisplayMode: =If(IsBlank(Trim(txtSAPCode.Text)), DisplayMode.Disabled, DisplayMode.Edit)
                                          Fill: =RGBA(0, 120, 212, 1)
                                          FillPortions: =0
                                          Font: =Font.'Segoe UI'
                                          Height: =36
                                          HoverBorderColor: =RGBA(0, 0, 0, 0)
                                          HoverColor: =RGBA(255, 255, 255, 1)
                                          HoverFill: =RGBA(16, 110, 190, 1)
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =With(
                                                {id: SelectedRequestID, code: Upper(Trim(txtSAPCode.Text))},
                                                IfError(
                                                    Patch(Requests, LookUp(Requests, Title = id), {Status: "Created in SAP", SAPCode: code});
                                                    Notify(id & " marked as created in SAP as " & code & ". The requestor will be told.", NotificationType.Success);
                                                    Refresh(Requests),
                                                    Notify("Couldn't update: " & FirstError.Message, NotificationType.Error)
                                                )
                                            )
                                          PressedBorderColor: =RGBA(0, 69, 120, 1)
                                          PressedColor: =RGBA(255, 255, 255, 1)
                                          PressedFill: =RGBA(16, 110, 190, 1)
                                          RadiusBottomLeft: =4
                                          RadiusBottomRight: =4
                                          RadiusTopLeft: =4
                                          RadiusTopRight: =4
                                          Size: =11
                                          Text: ="Mark as created in SAP"
                                          Width: =220
