Screens:
  NewRequestScreen:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    Children:
      - ScreenContainer1:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - HeaderContainer1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - lblAppTitle:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        Color: =RGBA(50, 49, 48, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        FillPortions: =1
                        FocusedBorderThickness: =4
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =18
                        Text: ="OneRecord | New request"
                        Wrap: =false
                  - lblRequestor:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        Color: =RGBA(96, 94, 92, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        FillPortions: =0
                        FocusedBorderThickness: =4
                        Font: =Font.'Segoe UI'
                        Height: =48
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =11
                        Text: |-
                          ="Lives Group" & Char(10) & "Signed in: " & User().FullName
                        Width: =260
                        Wrap: =true
                  - btnGoNew_1:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(237, 235, 233, 1)
                        Fill: =RGBA(0, 120, 212, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =36
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(16, 110, 190, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Navigate(NewRequestScreen, ScreenTransition.None)
                        PressedBorderColor: =RGBA(0, 69, 120, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(16, 110, 190, 1)
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =11
                        Text: ="New request"
                        Visible: =true
                        Width: =140
                  - btnGoMine_1:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 120, 212, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Color: =RGBA(0, 120, 212, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(237, 235, 233, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =36
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(0, 120, 212, 1)
                        HoverFill: =RGBA(243, 242, 241, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Navigate(MyRequestsScreen, ScreenTransition.None)
                        PressedBorderColor: =RGBA(0, 69, 120, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(16, 110, 190, 1)
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =11
                        Text: ="My requests"
                        Visible: =true
                        Width: =140
                  - btnGoRules_1:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 120, 212, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Color: =RGBA(0, 120, 212, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(237, 235, 233, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =36
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(0, 120, 212, 1)
                        HoverFill: =RGBA(243, 242, 241, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Navigate(AdminScreen, ScreenTransition.None)
                        PressedBorderColor: =RGBA(0, 69, 120, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(16, 110, 190, 1)
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =11
                        Text: ="Rules (MDM)"
                        Visible: =IsMDM
                        Width: =140
            - EditBanner:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 244, 206, 1)
                  FillPortions: =0
                  Height: =150
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =Editing
                Children:
                  - lblEditMessage:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        Color: =RGBA(50, 49, 48, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        FillPortions: =0
                        FocusedBorderThickness: =4
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingLeft: =0
                        Size: =12
                        Text: |-
                          ="Editing " & EditID & ". " & Coalesce(EditAsk.ActorRole, "An approver") & " asked for changes: " & Coalesce(EditAsk.Detail, "(no comment)")
                        Wrap: =true
                  - txtReplyNote:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(200, 198, 196, 1)
                        Color: =RGBA(50, 49, 48, 1)
                        Default: =""
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =38
                        HintText: ="Reply to the approver (optional), e.g. Licence no. added from the HSA certificate"
                        HoverBorderColor: =RGBA(16, 110, 190, 1)
                        HoverColor: =RGBA(50, 49, 48, 1)
                        HoverFill: =RGBA(255, 255, 255, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PressedBorderColor: =RGBA(0, 120, 212, 1)
                        PressedColor: =RGBA(50, 49, 48, 1)
                        PressedFill: =RGBA(255, 255, 255, 1)
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =11
                  - rowEditButtons:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingLeft: =0
                      Children:
                        - lblEditHelp:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              Color: =RGBA(96, 94, 92, 1)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              FillPortions: =1
                              FocusedBorderThickness: =4
                              Font: =Font.'Segoe UI'
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingLeft: =0
                              Size: =10
                              Text: ="Change the fields below, then press Resubmit. Only the approver who asked sees it again; the MDM final check sees what changed."
                              Wrap: =true
                        - btnCancelEdit:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 120, 212, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Color: =RGBA(0, 120, 212, 1)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(237, 235, 233, 1)
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =34
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(0, 120, 212, 1)
                              HoverFill: =RGBA(243, 242, 241, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: |-
                                =Set(gEditID, "");
                                Reset(txtReplyNote);
                                Navigate(MyRequestsScreen, ScreenTransition.None)
                              PressedBorderColor: =RGBA(0, 69, 120, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(16, 110, 190, 1)
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Size: =11
                              Text: ="Cancel edit"
                              Width: =120
            - DupBanner:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =If(DupStatus = "Blocked", RGBA(253, 231, 233, 1), RGBA(255, 244, 206, 1))
                  FillPortions: =0
                  Height: =If(tglNotDuplicate.Value, 168, 124)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =DupStatus <> "Clear"
                Children:
                  - lblDupMessage:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        Color: =RGBA(50, 49, 48, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        FillPortions: =0
                        FocusedBorderThickness: =4
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =66
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =11
                        Text: =DupMessage
                        VerticalAlign: =VerticalAlign.Top
                        Wrap: =true
                  - tglNotDuplicate:
                      Control: Classic/Toggle@2.1.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(50, 49, 48, 1)
                        Default: =If(Editing, !IsBlank(EditRec.DupReason), false)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        FalseFill: =RGBA(96, 94, 92, 1)
                        FalseHoverFill: =RGBA(50, 49, 48, 1)
                        FalseText: =If(DupStatus = "Blocked", "Not the same " & Noun, "This is a different " & Noun)
                        FillPortions: =0
                        FocusedBorderThickness: =4
                        Font: =Font.'Segoe UI'
                        Height: =36
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        Size: =12
                        TrueFill: =RGBA(0, 120, 212, 1)
                        TrueHoverFill: =RGBA(16, 110, 190, 1)
                        TrueText: =If(DupStatus = "Blocked", "Not the same " & Noun, "This is a different " & Noun)
                        Width: =420
                  - txtDupReason:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(200, 198, 196, 1)
                        Color: =RGBA(50, 49, 48, 1)
                        Default: =If(Editing, EditRec.DupReason, "")
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =38
                        HintText: ="Why is it different? e.g. separate legal entity with its own registration no. (approvers see this)"
                        HoverBorderColor: =RGBA(16, 110, 190, 1)
                        HoverColor: =RGBA(50, 49, 48, 1)
                        HoverFill: =RGBA(255, 255, 255, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PressedBorderColor: =RGBA(0, 120, 212, 1)
                        PressedColor: =RGBA(50, 49, 48, 1)
                        PressedFill: =RGBA(255, 255, 255, 1)
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =11
                        Visible: =tglNotDuplicate.Value
            - MainContainer1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - blkRequestType:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =92
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Visible: =true
                        Width: =Min(Parent.Width - 48, 720)
                      Children:
                        - lblRequestType:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              Color: =RGBA(50, 49, 48, 1)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              FillPortions: =0
                              FocusedBorderThickness: =4
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingLeft: =0
                              Size: =12
                              Text: ="Request type *"
                        - ddRequestType:
                            Control: Classic/DropDown@2.3.1
                            Properties:
                              BorderColor: =RGBA(200, 198, 196, 1)
                              ChevronBackground: =RGBA(255, 255, 255, 1)
                              ChevronDisabledBackground: =RGBA(242, 242, 241, 0)
                              ChevronDisabledFill: =RGBA(161, 159, 157, 1)
                              ChevronFill: =RGBA(50, 49, 48, 1)
                              ChevronHoverBackground: =RGBA(245, 245, 245, 1)
                              ChevronHoverFill: =RGBA(50, 49, 48, 1)
                              Color: =RGBA(50, 49, 48, 1)
                              Default: =If(Editing, EditRec.RequestType, "Customer")
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              DisplayMode: =If(Editing, DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =38
                              HoverBorderColor: =RGBA(16, 110, 190, 1)
                              HoverColor: =RGBA(50, 49, 48, 1)
                              HoverFill: =RGBA(245, 245, 245, 1)
                              Items: =RequestTypes
                              Items.Value: =Value
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =5
                              PaddingTop: =5
                              PressedBorderColor: =RGBA(16, 110, 190, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(0, 120, 212, 1)
                              SelectionColor: =RGBA(50, 49, 48, 1)
                              SelectionFill: =RGBA(0, 120, 212, 1)
                              Size: =12
                        - hlpRequestType:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              Color: =RGBA(96, 94, 92, 1)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              FillPortions: =0
                              FocusedBorderThickness: =4
                              Font: =Font.'Segoe UI'
                              Height: =20
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingLeft: =0
                              Size: =10
                              Text: ="What are you asking MDM to create?"
                  - blkEntity:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =92
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Visible: =true
                        Width: =Min(Parent.Width - 48, 720)
                      Children:
                        - lblEntity:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              Color: =RGBA(50, 49, 48, 1)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              FillPortions: =0
                              FocusedBorderThickness: =4
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingLeft: =0
                              Size: =12
                              Text: ="Business entity *"
                        - ddEntity:
                            Control: Classic/DropDown@2.3.1
                            Properties:
                              AllowEmptySelection: =true
                              BorderColor: =RGBA(200, 198, 196, 1)
                              ChevronBackground: =RGBA(255, 255, 255, 1)
                              ChevronDisabledBackground: =RGBA(242, 242, 241, 0)
                              ChevronDisabledFill: =RGBA(161, 159, 157, 1)
                              ChevronFill: =RGBA(50, 49, 48, 1)
                              ChevronHoverBackground: =RGBA(245, 245, 245, 1)
                              ChevronHoverFill: =RGBA(50, 49, 48, 1)
                              Color: =RGBA(50, 49, 48, 1)
                              Default: =If(Editing, LookUp(BusinessUnits, Title = EditRec.Entity).BusinessUnitName, "")
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              DisplayMode: =If(Editing, DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =38
                              HoverBorderColor: =RGBA(16, 110, 190, 1)
                              HoverColor: =RGBA(50, 49, 48, 1)
                              HoverFill: =RGBA(245, 245, 245, 1)
                              Items: |-
                                =ForAll(Filter(BusinessUnits, Active = true), {Value: BusinessUnitName, Code: Title})
                              Items.Value: =Value
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =5
                              PaddingTop: =5
                              PressedBorderColor: =RGBA(16, 110, 190, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(0, 120, 212, 1)
                              SelectionColor: =RGBA(50, 49, 48, 1)
                              SelectionFill: =RGBA(0, 120, 212, 1)
                              Size: =12
                        - hlpEntity:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              Color: =RGBA(96, 94, 92, 1)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              FillPortions: =0
                              FocusedBorderThickness: =4
                              Font: =Font.'Segoe UI'
                              Height: =20
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingLeft: =0
                              Size: =10
                              Text: ="Which Lives Group business this is for"
                  - blkCustomerName:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =92
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Visible: =SelectedType = "Customer" && "CustomerName" in VisibleFields.FieldName
                        Width: =Min(Parent.Width - 48, 720)
                      Children:
                        - lblCustomerName:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              Color: =RGBA(50, 49, 48, 1)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              FillPortions: =0
                              FocusedBorderThickness: =4
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingLeft: =0
