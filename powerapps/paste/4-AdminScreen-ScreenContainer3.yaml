                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Visible: =true
                      Children:
                        - lblFLineRole:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              Color: =RGBA(96, 94, 92, 1)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              FillPortions: =0
                              FocusedBorderThickness: =4
                              Font: =Font.'Segoe UI'
                              Height: =36
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingLeft: =0
                              Size: =11
                              Text: ="Extra approver"
                              Width: =140
                        - ddLineRole:
                            Control: Classic/DropDown@2.3.1
                            Properties:
                              AllowEmptySelection: =true
                              BorderColor: =RGBA(200, 198, 196, 1)
                              ChevronBackground: =RGBA(255, 255, 255, 1)
                              ChevronDisabledBackground: =RGBA(242, 242, 241, 0)
                              ChevronDisabledFill: =RGBA(161, 159, 157, 1)
                              ChevronFill: =RGBA(50, 49, 48, 1)
                              ChevronHoverBackground: =RGBA(245, 245, 245, 1)
                              ChevronHoverFill: =RGBA(50, 49, 48, 1)
                              Color: =RGBA(50, 49, 48, 1)
                              Default: =""
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              Height: =36
                              HoverBorderColor: =RGBA(16, 110, 190, 1)
                              HoverColor: =RGBA(50, 49, 48, 1)
                              HoverFill: =RGBA(245, 245, 245, 1)
                              Items: =ApproverRoles
                              Items.Value: =Value
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =5
                              PaddingTop: =5
                              PressedBorderColor: =RGBA(16, 110, 190, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(0, 120, 212, 1)
                              SelectionColor: =RGBA(50, 49, 48, 1)
                              SelectionFill: =RGBA(0, 120, 212, 1)
                              Size: =11
                  - lblLineRoleHelp:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        Color: =RGBA(96, 94, 92, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        FillPortions: =0
                        FocusedBorderThickness: =4
                        Font: =Font.'Segoe UI'
                        Height: =30
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingLeft: =0
                        Size: =10
                        Text: ="Optional. Leave blank if it needs only the usual approvals. Not in the list? Add the person under Businesses and people first."
                        Wrap: =true
                  - lblLineSentence:
                      Control: Label@2.5.1
                      Properties:
                        AutoHeight: =true
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        Color: =RGBA(50, 49, 48, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Fill: =RGBA(239, 246, 252, 1)
                        FillPortions: =0
                        FocusedBorderThickness: =4
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =30
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingLeft: =8
                        Size: =12
                        Text: ="Item requests can choose " & Coalesce(Upper(Trim(txtLineCode.Text)), "the new line") & If(IsBlank(Trim(txtLineName.Text)), "", " (" & Trim(txtLineName.Text) & ")") & ". " & If(CountRows(colLineFields) = 0, "No extra fields", "They also ask for " & Concat(colLineFields, DisplayLabel, ", ")) & If(IsBlank(ddLineRole.Selected.Value), ", and the usual approvals.", ", and " & ddLineRole.Selected.Value & " approves them too.")
                        Wrap: =true
                  - lblLineNewField:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        Color: =RGBA(96, 94, 92, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        FillPortions: =0
                        FocusedBorderThickness: =4
                        Font: =Font.'Segoe UI'
                        Height: =30
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingLeft: =0
                        Size: =10
                        Text: |-
                          ="Needs a field the form doesn't have yet (e.g. calibration interval)? That's an app change: ask the OneRecord team."
                        Wrap: =true
                  - LineBtns:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingLeft: =0
                      Children:
                        - lblLineBtnsGap:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              Color: =RGBA(50, 49, 48, 1)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              FillPortions: =1
                              FocusedBorderThickness: =4
                              Font: =Font.'Segoe UI'
                              Height: =36
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Text: =""
                        - btnLineBtnsCancel:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 120, 212, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Color: =RGBA(0, 120, 212, 1)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(237, 235, 233, 1)
                              DisplayMode: =If(IsMDM, DisplayMode.Edit, DisplayMode.Disabled)
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =36
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(0, 120, 212, 1)
                              HoverFill: =RGBA(243, 242, 241, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: |-
                                =UpdateContext({locPanel: ""})
                              PressedBorderColor: =RGBA(0, 69, 120, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(16, 110, 190, 1)
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Size: =11
                              Text: ="Cancel"
                              Width: =110
                        - btnLineBtnsSave:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(255, 255, 255, 1)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(237, 235, 233, 1)
                              DisplayMode: =If(IsMDM, DisplayMode.Edit, DisplayMode.Disabled)
                              Fill: =RGBA(0, 120, 212, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =36
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(16, 110, 190, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: |-
                                =With(
                                    {code: Upper(Trim(txtLineCode.Text)), name: Trim(txtLineName.Text)},
                                    If(
                                        !IsMatch(code, "^[A-Z0-9]{1,5}$"), Notify("Enter a code of 1 to 5 letters or digits, e.g. D.", NotificationType.Warning),
                                        IsBlank(name), Notify("Enter a name for the product line.", NotificationType.Warning),
                                        !IsBlank(LookUp(ChoiceRows, List = "ProductFamily" && Upper(Value) = code)),
                                            Notify(code & " already exists. Turn it on under Product lines instead.", NotificationType.Warning),
                                        IfError(
                                            Patch(ChoiceOptions, Defaults(ChoiceOptions), {Title: code, ListName: "ProductFamily", Details: name,
                                                SortOrder: Coalesce(Max(Filter(ChoiceRows, List = "ProductFamily"), Order), 0) + 10, Active: true});
                                            ForAll(colLineFields As c,
                                                With({r: LookUp(RequiredFields, Title = c.Title)},
                                                    Patch(RequiredFields, r, {ConditionValue: If(IsBlank(r.ConditionValue), code, r.ConditionValue & ";" & code)})));
                                            If(!IsBlank(ddLineBU.Selected.Code),
                                                With({b: LookUp(BusinessUnits, Title = ddLineBU.Selected.Code)},
                                                    Patch(BusinessUnits, b, {Products: If(IsBlank(Trim(b.Products)), code, b.Products & ", " & code)})));
                                            If(!IsBlank(ddLineRole.Selected.Value),
                                                Patch(RoutingRules, Defaults(RoutingRules), {Title: "R" & Text(Coalesce(First(Sort(RoutingRules, ID, SortOrder.Descending)).ID, 0) + 1, "00"), RequestType: "Item", Entity: "Any",
                                                    ConditionField: "ProductFamily", ConditionValue: code, ApproverRole: ddLineRole.Selected.Value,
                                                    Stage: 1, SLADays: 2, EscalateAfterDays: 4, Active: true}));
                                            Notify(code & " added. It's on the item form now.", NotificationType.Success);
                                            UpdateContext({locPanel: ""}),
                                            Notify("Couldn't add the product line: " & FirstError.Message, NotificationType.Error)
                                        )
                                    )
                                )
                              PressedBorderColor: =RGBA(0, 69, 120, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(16, 110, 190, 1)
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Size: =11
                              Text: ="Add product line"
                              Width: =150
